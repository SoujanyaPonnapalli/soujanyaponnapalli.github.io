{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- Libre Franklin for body and headings, matching Matei Zaharia's homepage,
     which loads the same four weights from Google Fonts. Nobody has this face
     installed, so it always downloads; display=swap renders the system sans
     stack from _variables.scss first rather than blocking on it.
     JetBrains Mono is for code blocks. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css" data-turbo-track="reload">

<!-- Turbo Drive: navigations fetch the next page and swap the <body> instead
     of tearing down and rebuilding the whole document, so the masthead, the
     stylesheet and the fonts are never re-parsed. It also prefetches a link
     on hover, so most clicks land on an already-fetched page. Loaded in the
     <head> because Turbo merges heads across visits but replaces the body:
     a script down in the body would be re-executed on every navigation.
     data-turbo-track="reload" above forces a real reload when main.css
     changes, so a deploy can never leave a page on a stale stylesheet. -->
<script src="{{ base_path }}/assets/js/turbo.min.js" defer></script>
<script>
  /* Mark the document once Turbo starts swapping bodies, so the theme's
     staggered fade-in runs on the first load and never again. This event does
     not fire on the initial page load, only on Turbo visits.

     Block comment, not `//`: the HTML compressor collapses inline scripts onto
     a single line, and a line comment would then swallow the code after it. */
  addEventListener("turbo:before-render", function () {
    document.documentElement.classList.add("turbo-visited");
  }, { once: true });
</script>

<meta http-equiv="cleartype" content="on">
