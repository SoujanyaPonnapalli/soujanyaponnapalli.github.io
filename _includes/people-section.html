{% comment %}
  Two-column people row: section label on the left, names on the right,
  mirroring the label column the CV uses for WORK & EDUCATION, MENTORING etc.
{% endcomment %}

<div class="people-section">
  <div class="people-label">{{ post.title }}</div>
  <div class="people-names">{{ post.content }}</div>
</div>
