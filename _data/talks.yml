# Talks, in the order they appear on /talks/ — there is no sort key, so file order
# is render order, the same convention as _data/mentees.yml.
#
# `venue` is the badge: one per talk, the most notable place it was given. A talk
# given more than once names the others in `note`, which renders as grey text under
# the title. Keep the file ordered by the badge's date, so the badges read down the
# page in reverse chronology.
#
# Links resolve in this order: an explicit `slides:` / `video:` / `poster:` here, else
# `permalink:` looked up in _publications for its slidesurl / talkurl / posterurl, else
# the pill is omitted. Venue names are kept short; the badge column fits ~104px of text.

